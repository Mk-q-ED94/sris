name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/worker/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Install Worker dependencies
        working-directory: apps/worker
        run: npm install --no-audit --no-fund

      - name: Type-check
        working-directory: apps/worker
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/worker
        run: npm test

      - name: Wrangler dry-run (production config)
        working-directory: apps/worker
        env:
          CLOUDFLARE_D1_DATABASE_ID: 00000000-0000-0000-0000-000000000000
        run: |
          node -e "const fs=require('fs'); const p='wrangler.jsonc'; const s=fs.readFileSync(p,'utf8').replace(/REPLACE_WITH_D1_DATABASE_ID/g, process.env.CLOUDFLARE_D1_DATABASE_ID).replace(/REPLACE_WITH_STAGING_D1_DATABASE_ID/g, process.env.CLOUDFLARE_D1_DATABASE_ID); fs.writeFileSync(p,s);"
          npx wrangler deploy --dry-run --env=""
