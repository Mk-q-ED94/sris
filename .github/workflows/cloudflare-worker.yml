name: Deploy SRIS to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SRIS_API_TOKEN: ${{ secrets.SRIS_API_TOKEN }}
          SRIS_CRON_SECRET: ${{ secrets.SRIS_CRON_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID SRIS_API_TOKEN SRIS_CRON_SECRET LLM_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit $missing

      - name: Inject D1 database id into Wrangler config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node -e "const fs=require('fs'); const p='apps/worker/wrangler.jsonc'; const id=process.env.CLOUDFLARE_D1_DATABASE_ID; const s=fs.readFileSync(p,'utf8').replace(/REPLACE_WITH_D1_DATABASE_ID/g, id).replace(/REPLACE_WITH_STAGING_D1_DATABASE_ID/g, id); fs.writeFileSync(p,s);"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Install Worker dependencies
        working-directory: apps/worker
        run: npm install --no-audit --no-fund

      - name: Create Worker secrets file
        working-directory: apps/worker
        env:
          API_TOKEN: ${{ secrets.SRIS_API_TOKEN }}
          CRON_SECRET: ${{ secrets.SRIS_CRON_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          node -e "
            const fs = require('fs');
            const out = {
              API_TOKEN: process.env.API_TOKEN,
              CRON_SECRET: process.env.CRON_SECRET,
              LLM_API_KEY: process.env.LLM_API_KEY,
            };
            // Optional overrides — only include if the GitHub secret is set,
            // otherwise the Worker falls back to the defaults in
            // routes/extract.ts (api.openai.com/v1, gpt-4o-mini).
            if (process.env.LLM_BASE_URL) out.LLM_BASE_URL = process.env.LLM_BASE_URL;
            if (process.env.LLM_MODEL) out.LLM_MODEL = process.env.LLM_MODEL;
            fs.writeFileSync('.secrets.json', JSON.stringify(out));
          "

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          packageManager: npm
          wranglerVersion: "4.90.1"
          command: d1 migrations apply sris-db --remote

      - name: Deploy Worker with secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          packageManager: npm
          wranglerVersion: "4.90.1"
          command: deploy --secrets-file .secrets.json --env=""
