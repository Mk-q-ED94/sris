name: SRIS arXiv ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API ingest
        run: |
          curl --fail --request POST "${{ secrets.SRIS_API_URL }}/ingest/arxiv/run" \
            --header "x-cron-secret: ${{ secrets.SRIS_CRON_SECRET }}"
