services:
  - type: web
    name: sris-api
    runtime: python
    plan: starter
    rootDir: apps/api
    buildCommand: uv sync
    startCommand: uv run uvicorn sris_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOWED_USER_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
