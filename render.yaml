services:
  - type: web
    name: sris-api
    runtime: python
    plan: starter
    rootDir: apps/api
    buildCommand: uv sync
    startCommand: uv run uvicorn sris_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOWED_USER_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
cronJobs:
  - name: sris-arxiv-daily
    runtime: python
    rootDir: apps/api
    schedule: "15 23 * * *"
    buildCommand: uv sync
    startCommand: uv run python -m sris_api.jobs.run_arxiv_ingest
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: sris-api
          property: host
      - key: CRON_SECRET
        sync: false
